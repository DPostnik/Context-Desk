name: Workflow feedback
description: Describe a task you tried and where the interface helped or got in the way.
title: "[Feedback]: "
body:
  - type: textarea
    id: task
    attributes:
      label: What were you trying to do?
      description: A concrete, non-private example is most useful.
    validations:
      required: true
  - type: textarea
    id: friction
    attributes:
      label: What happened, and what would you change?
    validations:
      required: true
